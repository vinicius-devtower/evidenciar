version: "3.8"

services:
  app:
    build: .
    container_name: saas_app
    volumes:
      - .:/var/www/html
    ports:
      - "8000:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: saas_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saas
      MYSQL_USER: saas
      MYSQL_PASSWORD: saas
    ports:
      - "3306:3306"